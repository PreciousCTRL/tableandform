<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <style>
        table{
            border: 5px solid #303c6c;
            border-collapse: collapse;
            margin:10px auto;
        }
        td, th{
            border-bottom: 1px solid #b4dfe5;
            border-collapse: collapse;
            padding:15px;
        }
        body{
            font-family: Tahoma;
            color:navy;
            font-size: 1.125em;
        }
        thead tr{
            background-color: #b4dfe5;
        }
        input[type=text], textarea, select{
            padding: 12px 20px;
            margin: 8px 0;
            display: inline-block;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type=submit]{
            width: 100%;
            background-color: #b4dfe5;
            color: navy;
            margin: 8px 0;
            padding:14px 20px;
            border: none;
            border-radius: 4px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size:1.125em;
        }
        textarea{
            resize: none;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Value</th>
            </tr>
        </thead>
        <tbody>
           <tr>
                <td><label for="name">Name: </label></td>
                <td><input type="text" name = "name" placeholder="Type your name here" size="30" maxlength="50"></td>
            </tr> 
            <tr>
                <td><label for="sex"></label>Sex:</td>
                <td><input type="radio" id="male" name = "gender" value="male" CHECKED><label for="male">Male</label>
                <br>
                <input type="radio" id="female" name = "gender" value="female"><label for="female">Female</label>
                <br>
                <input type="radio" id="other" name = "gender" value="other"><label for="other">Other</label>
                </td>
            </tr>
            <tr>
                <td><label for="eyeColor">Eye Color</label></td>
                <td>
                    <select name="eyeColor" id = "eyeColor" size="1">
                        <option value = "green">Green</option>
                        <option value = "blue">Blue</option>
                        <option value = "brown">Brown</option>
                        <option value = "black" SELECTED>Black</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="checkAll">Check all the Applies</label></td>
                <td>
                    <input type = "checkbox" id = "feature1" name="feature1" value="6ft.">
                    <label for="feature1">Over 6ft. Tall</label>
                    <br>
                    <input type = "checkbox" id = "feature2" name="feature2" value="200lbs.">
                    <label for="feature2">Over 200 pounds</label>
                    <br>
                    <input type = "checkbox" id = "feature3" name="feature3" value="less than 200lbs.">
                    <label for="feature3">Less than 200 pounds</label>
                    <br>
                </td>
            </tr>
            <tr>
                <td><label for ="ability">Describe your atheletic ability</label></td>
                <td>
                    <textarea rows="10" cols="30"></textarea>
                </td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan = "2">
                    <input type="submit" id="btn1" value="Enter my Information">
                </td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
